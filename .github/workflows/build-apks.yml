name: Build APKs

on:
  workflow_dispatch:

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug + Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (if present)
        id: release_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release unsigned::KEYSTORE_BASE64 secret missing; release APKs will be unsigned."
            {
              echo "### Signing"
              echo ""
              echo "- Release: **unsigned** (KEYSTORE_BASE64 missing). Installs will not update existing release installs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble debug + release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          SIGN_ARGS=()
          if [ "${{ steps.release_signing.outputs.present }}" = "true" ]; then
            SIGN_ARGS=(
              "-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/release.keystore"
              "-Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD}"
              "-Pandroid.injected.signing.key.alias=${KEY_ALIAS}"
              "-Pandroid.injected.signing.key.password=${KEY_PASSWORD}"
            )
          fi
          ./gradlew assembleHiddenDebug assembleHiddenRelease --stacktrace "${SIGN_ARGS[@]}"

      - name: Collect APKs
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -e
          mkdir -p artifacts/debug artifacts/release
          shopt -s nullglob globstar
          for apk in app/build/outputs/apk/**/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" .apk)
            if [[ "$apk" == *"/debug/"* ]]; then
              cp "$apk" "artifacts/debug/${base}-${SHORT_SHA}.apk"
            elif [[ "$apk" == *"/release/"* ]]; then
              cp "$apk" "artifacts/release/${base}-${SHORT_SHA}.apk"
            fi
          done
          {
            echo "### Built APKs"
            echo ""
            echo '```'
            ls -1 artifacts/debug 2>/dev/null | sed 's|^|debug/|'
            ls -1 artifacts/release 2>/dev/null | sed 's|^|release/|'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: artifacts/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: artifacts/release/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup release keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/release.keystore"
